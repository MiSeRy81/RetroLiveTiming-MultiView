name: Inspect v1.0.0 ASAR base

on:
  push:
    branches: [main]
    paths:
      - '.release-build/complete'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download v1.0.0 portable base
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/retrolivetiming-v1.0.0.zip \
            'https://github.com/MiSeRy81/RetroLiveTiming-MultiView/releases/download/v1.0.0/RetroLiveTiming-MultiView-v1.0.0-Windows.zip'
          rm -rf /tmp/retrolivetiming-base
          mkdir -p /tmp/retrolivetiming-base
          unzip -q /tmp/retrolivetiming-v1.0.0.zip -d /tmp/retrolivetiming-base
          BASE_ASAR="$(find /tmp/retrolivetiming-base -type f -name app.asar | head -n 1)"
          test -n "$BASE_ASAR"
          cp "$BASE_ASAR" /tmp/base-app.asar
          sha256sum /tmp/base-app.asar

      - name: Upload base ASAR for comparison
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-base-app-asar
          path: /tmp/base-app.asar
          compression-level: 0
